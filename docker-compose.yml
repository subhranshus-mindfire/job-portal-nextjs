version: "3.8"

services:
  frontend_next:
    build:
      context: .
      dockerfile: Dockerfile 
    container_name: job_portal_frontend
    environment:
    - NEXT_PUBLIC_API_URL=http://backend:5000/api
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
 

  nginx_frontend:
    image: nginx:latest
    container_name: nginx_frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/frontend.nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend_next
